<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon League Creator</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#12141c;color:#eee;display:flex;min-height:100vh}
nav{width:200px;background:#1c1f2b;padding:14px;position:sticky;top:0;height:100vh;flex:none}nav h1{font-size:16px;color:#ffcb05;margin:0 0 14px}
nav a{display:block;padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px}nav a:hover{background:#2a2e3f}nav a.on{background:#e63946}
main{flex:1;padding:22px;min-width:0}h2{margin-top:0}h3{color:#ffcb05;border-bottom:2px solid #e63946;padding-bottom:4px}
button,select,input,textarea{font:inherit;padding:7px 10px;border-radius:7px;border:1px solid #3a3f55;background:#242838;color:#eee}
button{background:#e63946;border:0;cursor:pointer;margin:2px}button.s{background:#3a3f55}button:hover{filter:brightness(1.15)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.pk{background:#1c1f2b;border-radius:8px;text-align:center;padding:6px;cursor:pointer;font-size:11px}.pk:hover{outline:2px solid #ffcb05}.pk img{width:80px;height:80px;object-fit:contain}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tc{border-radius:12px;padding:10px;cursor:pointer;border:2px solid #ffcb05;position:relative}.tc:hover{transform:translateY(-2px)}
.tc .p{width:100%;height:110px;object-fit:contain;background:#0006;border-radius:8px}.tc b{display:block;margin-top:4px}
.tm img{width:34px;height:34px}.bd{position:absolute;right:8px;top:8px;width:40px;height:40px;object-fit:contain}
#modal:not(:empty){position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}
.mb{background:#1c1f2b;border-radius:12px;padding:20px;width:900px;max-width:95vw;max-height:90vh;overflow:auto}
.mb label{display:block;margin:8px 0}.mb input:not([type=file]):not([type=checkbox]),.mb textarea,.mb select{width:100%;display:block;margin-top:3px}
.row{display:flex;align-items:center;gap:6px;margin:3px 0}.row img{width:40px;height:40px}.row span{flex:1}
canvas{width:100%;border-radius:10px}.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.px{width:auto;max-width:100%;image-rendering:pixelated;border-radius:0;background:repeating-conic-gradient(#2a2e3f 0 25%,#1c1f2b 0 50%) 0 0/16px 16px}@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;gap:4px}nav h1{display:none}nav a{white-space:nowrap}main{padding:12px}}@media print{nav,button{display:none}body{background:#fff;color:#000}.tc{break-inside:avoid}}
</style></head><body>
<nav id="nav"></nav><main id="main"></main><div id="modal"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const TY={normal:['Normal','#a8a77a'],fire:['Feu','#ee8130'],water:['Eau','#6390f0'],grass:['Plante','#7ac74c'],electric:['Électrik','#f7d02c'],ice:['Glace','#96d9d6'],fighting:['Combat','#c22e28'],poison:['Poison','#a33ea1'],ground:['Sol','#e2bf65'],flying:['Vol','#a98ff3'],psychic:['Psy','#f95587'],bug:['Insecte','#a6b91a'],rock:['Roche','#b6a136'],ghost:['Spectre','#735797'],dragon:['Dragon','#6f35fc'],dark:['Ténèbres','#705746'],steel:['Acier','#b7b7ce'],fairy:['Fée','#d685ad']};
const TT=["Champion d'Arène","Conseil 4","Maître de la Ligue","Boss"];
const KEYS=[...[1,2,3,4,5,6,7,8].map(i=>'c'+i),...[1,2,3,4].map(i=>'e'+i),'m1'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SP=(id,sh)=>'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+(id<=649?'versions/generation-v/black-white/':'')+(sh?'shiny/':'')+id+'.png';
const GN=[['Gén. 1',151],['Gén. 2',251],['Gén. 3',386],['Gén. 4',493],['Gén. 5',649],['Gén. 6',721],['Gén. 7',809],['Gén. 8',905],['Gén. 9',1025],['Formes',1e9]],gen=id=>GN.findIndex(g=>id<=g[1]);
const tyName=t=>t?TY[t][0]:'—',tyCol=t=>t?TY[t][1]:'#667';
let S,P=[],IT=[],cur='home',TS={};
const db=new Promise(r=>{const q=indexedDB.open('plc',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result)});
const load=async()=>{const d=await db;return new Promise(r=>{const g=d.transaction('k').objectStore('k').get('s');g.onsuccess=()=>r(g.result)})};
let sT;const save=()=>{clearTimeout(sT);sT=setTimeout(async()=>(await db).transaction('k','readwrite').objectStore('k').put(S,'s'),300)};
const rd=f=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});
const ld=s=>new Promise(r=>{if(!s)return r(null);const i=new Image;i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=()=>{if(s.includes('black-white')&&!i.f){i.f=1;i.src=s.replace('versions/generation-v/black-white/','')}else r(null)};i.src=s});
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()};
const mk=k=>({name:'',title:TT[k[0]=='c'?0:k[0]=='e'?1:k[0]=='m'?2:3],spec:'',bio:'',img:'',a:0,T:['Première rencontre','Revanche','Post-game'].map(n=>({n,team:[]})),badge:{name:'',img:''},tpl:k[0]=='m'?2:k[0]=='e'||k[0]=='x'?1:0,cc:'',z:1,ox:0,oy:0,num:k[0]=='c'?+k[1]:0,rw:''});
const ks=()=>[...KEYS,...S.ex],tm=t=>t.T[t.a].team;const initS=()=>{const tr={};KEYS.forEach(k=>tr[k]=mk(k));return{fk:[],ex:[],tr}};
const info=r=>{const f=r.k=='f'&&S.fk.find(a=>a.id==r.id);return{n:r.k=='f'?(f?f.name:'?'):r.n,s:r.cimg||(r.k=='f'?(f?(r.sh&&f.simg?f.simg:f.img):''):SP(r.form||r.id,r.sh))}};const im=r=>`<img src="${info(r).s}">`;
const M=h=>$('#modal').innerHTML=`<div class="mb">${h}</div>`,X=()=>{$('#modal').innerHTML='';render(cur)};

const NAV=[['home','🏠 Tableau de bord'],['dex','📖 Pokédex'],['fk','✨ Fakémon'],['champ',"🏅 Champions d'Arène"],['conseil','🔥 Conseil 4'],['maitre','👑 Maître'],['badge','🎖️ Badges'],['cards','🃏 Cartes générées'],['spr','🎞️ Sprites']];
function render(v){cur=v;$('#nav').innerHTML='<h1>Pokémon League Creator</h1>'+NAV.map(([k,l])=>`<a class="${k==v?'on':''}" onclick="render('${k}')">${l}</a>`).join('');
const m=$('#main');clearInterval(window._pt);if(v=='spr'){spr(m);return}
if(v=='home')m.innerHTML=`<h2>Ma Ligue Pokémon</h2><p>${S.fk.length} Fakémon · ${ks().filter(k=>S.tr[k].name).length} dresseurs créés · ${P.length} Pokémon officiels chargés</p>
<button onclick="expJ()">💾 Exporter le projet</button><label class="s" style="display:inline-block"><button onclick="this.nextSibling.click()" class="s">📂 Importer un projet</button><input type="file" hidden accept=".json" onchange="impJ(this.files[0])"></label><button class="s" onclick="pdf()">📄 PDF</button><button class="s" onclick="recap()">🖼 Image récap</button><button class="s" onclick="snap()">📌 Sauvegarder</button><button class="s" onclick="rest()">↩ Restaurer</button><button onclick="addBoss()">+ Boss</button>${sec('Les 8 Champions d\'Arène',KEYS.slice(0,8))}${sec('Le Conseil 4',KEYS.slice(8,12))}${sec('Le Maître de la Ligue',['m1'])}${S.ex.length?sec('Boss supplémentaires',S.ex):''}`;
else if(v=='champ')m.innerHTML='<h2>Champions d\'Arène</h2>'+sec('',KEYS.slice(0,8));
else if(v=='conseil')m.innerHTML='<h2>Conseil 4</h2>'+sec('',KEYS.slice(8,12));
else if(v=='maitre')m.innerHTML='<h2>Maître de la Ligue</h2>'+sec('',['m1']);
else if(v=='dex'){m.innerHTML='<h2>Pokédex</h2><div id="l"></div>';lst($('#l'),null,false)}
else if(v=='fk'){m.innerHTML='<h2>Fakémon</h2><button onclick="fkEdit()">+ Nouveau Fakémon</button><p>Cliquez sur un Fakémon pour le modifier.</p><div id="l"></div>';lst($('#l'),r=>fkEdit(r.id),true)}
else if(v=='badge')m.innerHTML='<h2>Badges</h2><div class="tg">'+KEYS.slice(0,8).map(k=>{const t=S.tr[k];return`<div class="tc" style="cursor:default;background:#1c1f2b"><b>Arène ${k[1]} — ${esc(t.name||'(vide)')}</b>${t.badge.img?`<img class="p" src="${t.badge.img}">`:'<div class="p" style="display:block"></div>'}<input placeholder="Nom du badge" value="${esc(t.badge.name)}" oninput="S.tr.${k}.badge.name=this.value;save()" style="width:100%;margin-top:6px"><input type="file" accept="image/png,image/webp" onchange="badgeUp('${k}',this.files[0])"></div>`}).join('')+'</div>';
else if(v=='cards'){m.innerHTML='<h2>Cartes générées</h2><button onclick="zipAll()">📦 ZIP</button><button class="s" onclick="pdf()">📄 PDF</button><button class="s" onclick="recap()">🖼 Image récap</button><div class="cg" id="cg"></div>';ks().filter(k=>S.tr[k].name).forEach(async k=>{const c=await draw(k),d=document.createElement('div');d.append(c);const b=document.createElement('button');b.textContent='⬇ PNG';b.onclick=()=>c.toBlob(x=>dl(x,S.tr[k].name+'.png'));d.append(b);$('#cg').append(d)})}}
const sec=(t,ks)=>(t?`<h3>${t}</h3>`:'')+'<div class="tg">'+ks.map(k=>{const d=S.tr[k];return`<div class="tc" draggable="true" data-k="${k}" style="background:linear-gradient(160deg,${d.tpl==2?'#33333d':d.cc||tyCol(d.spec)},#0a0a0d)" onclick="edit('${k}')">${d.badge.img&&k[0]=='c'?`<img class="bd" src="${d.badge.img}">`:''}${d.img?`<img class="p" src="${d.img}">`:'<div class="p" style="height:110px"></div>'}<b>${esc(d.name||(k[0]=='c'?'Champion '+k[1]:k[0]=='e'?'Membre '+k[1]:'Maître'))}</b><small>${tyName(d.spec)}</small><div class="tm">${tm(d).map(r=>im(r)).join('')}</div></div>`}).join('')+'</div>';

function lst(box,pick,fkOnly){box.innerHTML=`<input placeholder="Rechercher par nom…" id="q"> <select id="t"><option value="">Tous les types</option>${Object.entries(TY).map(([k,v])=>`<option value="${k}">${v[0]}</option>`)}</select> <select id="gn"><option value="">Toutes générations</option>${GN.map((g,i)=>`<option value="${i}">${g[0]}</option>`)}</select> ${pick&&!fkOnly?'<select id="s"><option value="p">Officiels</option><option value="f">Fakémon</option></select>':''}<div class="g" id="g"></div>`;
const g=box.querySelector('#g'),q=box.querySelector('#q'),t=box.querySelector('#t'),s=box.querySelector('#s'),gn=box.querySelector('#gn');let it=[];
const rf=async()=>{const n=q.value.toLowerCase(),ty=t.value;if(fkOnly||(s&&s.value=='f'))it=S.fk.filter(f=>f.name.toLowerCase().includes(n)&&(!ty||f.types.includes(ty))).map(f=>({k:'f',id:f.id,n:f.name,s:f.img}));
else{let set=null;if(ty){if(!TS[ty])try{TS[ty]=new Set((await(await fetch('https://pokeapi.co/api/v2/type/'+ty)).json()).pokemon.map(p=>+p.pokemon.url.split('/').at(-2)))}catch(e){TS[ty]=new Set()}set=TS[ty]}
it=P.filter(p=>p.n.includes(n)&&(!set||set.has(p.id))&&(!gn.value||gen(p.id)==gn.value)).slice(0,400).map(p=>({k:'p',id:p.id,n:p.n,s:SP(p.id)}))}
g.innerHTML=it.map((o,i)=>`<div class="pk" data-i="${i}"><img loading="lazy" src="${o.s}"><br>${esc(o.n)}</div>`).join('')||'<p>Aucun résultat.</p>'};
g.onclick=e=>{const d=e.target.closest('.pk');if(d&&pick){const o=it[d.dataset.i];pick(o.k=='f'?{k:'f',id:o.id}:{k:'p',id:o.id,n:o.n})}};
q.oninput=t.onchange=gn.onchange=rf;if(s)s.onchange=rf;rf()}

function fkEdit(id){const nw=!id,f=S.fk.find(a=>a.id==id)||{id:Date.now(),name:'',types:[],desc:'',img:''};const o=i=>`<select id="t${i}"><option value="">—</option>${Object.entries(TY).map(([k,v])=>`<option value="${k}" ${f.types[i]==k?'selected':''}>${v[0]}</option>`)}</select>`;
M(`<h2>Fakémon</h2><label>Nom<input id="n" value="${esc(f.name)}"></label><label>Image (PNG/WEBP)<input type="file" id="i" accept="image/*"></label><div id="pv">${f.img?`<img src="${f.img}" height="80">`:''}</div><label>Sprite chromatique (facultatif)<input type="file" id="si" accept="image/*"></label><label>Famille d'évolution (facultatif)<input id="fa" value="${esc(f.fam||'')}"></label><label>Type 1${o(0)}</label><label>Type 2${o(1)}</label><label>Description<textarea id="d">${esc(f.desc)}</textarea></label>
<button onclick="fkSave(${f.id},${nw})">Enregistrer</button>${nw?'':`<button class="s" onclick="if(confirm('Supprimer ?')){S.fk=S.fk.filter(a=>a.id!=${f.id});save();X()}">Supprimer</button>`}<button class="s" onclick="X()">Annuler</button>`);
$('#i').onchange=async e=>{f.img=await rd(e.target.files[0]);$('#pv').innerHTML=`<img src="${f.img}" height="80">`};$('#si').onchange=async e=>{f.simg=await rd(e.target.files[0])};window._f=f}
function fkSave(id,nw){const f=window._f;f.name=$('#n').value.trim();if(!f.name||!f.img)return alert('Nom et image requis.');f.types=[$('#t0').value,$('#t1').value].filter(Boolean);f.desc=$('#d').value;f.fam=$('#fa').value;if(nw)S.fk.push(f);save();X()}

const up=async(k,f)=>{if(f){S.tr[k].img=await rd(f);save();edit(k)}};
const badgeUp=async(k,f,e)=>{if(f){S.tr[k].badge.img=await rd(f);save();e?edit(k):render('badge')}};
const IB='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/';
const cl=t=>t.cc||(t.spec?TY[t.spec][1]:'#666666');
const isM=r=>r.mg||(r.form&&(P.find(p=>p.id==r.form)||{n:''}).n.includes('mega'));
const R=(k,i,p,v)=>{tm(S.tr[k])[i][p]=v;save()};
let pvT;const pv=k=>{clearTimeout(pvT);pvT=setTimeout(async()=>{const c=await draw(k),o=$('#pc');if(o){o.replaceWith(c);c.id='pc'}},150)};
const mig=()=>{S.ex=S.ex||[];Object.keys(S.tr).forEach(k=>{const t=S.tr[k];if(!t.T){const d=mk(k);t.T=d.T;t.T[0].team=t.team||[];delete t.team;Object.assign(t,{a:0,tpl:d.tpl,cc:'',z:1,ox:0,oy:0,num:d.num,rw:''})}})};
const snap=async()=>{(await db).transaction('k','readwrite').objectStore('k').put(JSON.parse(JSON.stringify(S)),'snap');alert('Sauvegarde manuelle effectuée.')};
const rest=async()=>{(await db).transaction('k').objectStore('k').get('snap').onsuccess=e=>{if(!e.target.result)return alert('Aucune sauvegarde manuelle.');if(confirm('Restaurer la dernière sauvegarde manuelle ?')){S=e.target.result;mig();save();render('home')}}};
const addBoss=()=>{const k='x'+Date.now();S.tr[k]=mk(k);S.tr[k].name='Nouveau boss';S.ex.push(k);save();edit(k)};
const dup=k=>{const n='x'+Date.now();S.tr[n]=JSON.parse(JSON.stringify(S.tr[k]));S.tr[n].name+=' (copie)';S.ex.push(n);save();edit(n)};
const del=k=>{if(confirm('Supprimer ce boss ?')){S.ex=S.ex.filter(x=>x!=k);delete S.tr[k];save();X()}};
const mv=(k,i,d)=>{const a=tm(S.tr[k]),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();edit(k)};
const sig=(k,i)=>{tm(S.tr[k]).forEach((r,j)=>r.sig=j==i&&!r.sig);save();edit(k)};
const cs=async(k,i,f)=>{if(f){R(k,i,'cimg',await rd(f));ps(k,i)}};
const add=k=>{const t=S.tr[k];if(tm(t).length>=6)return alert('6 Pokémon maximum.');M('<h2>Choisir un Pokémon</h2><div id="l"></div><button class="s" onclick="edit(\''+k+'\')">Retour</button>');lst($('#l'),r=>{if(tm(t).some(x=>x.k==r.k&&x.id==r.id)&&!confirm('Déjà dans cette équipe. Ajouter quand même ?'))return;tm(t).push(r);save();edit(k)},false)};
function edit(k){const t=S.tr[k],T=tm(t),ch=k[0]=='c',o=(p,l,v)=>`<label>${l}<input value="${esc(v)}" oninput="S.tr.${k}.${p}=this.value;save();pv('${k}')"></label>`,rg=(p,l,a,b,s)=>`<label>${l}<input type="range" min="${a}" max="${b}" step="${s}" value="${t[p]}" oninput="S.tr.${k}.${p}=+this.value;save();pv('${k}')"></label>`,sl=(p,x)=>`<select onchange="S.tr.${k}.${p}=this.value;save();pv('${k}')">${x}</select>`;
M(`<div style="display:flex;gap:16px;flex-wrap:wrap"><div style="flex:1;min-width:280px"><h2>${esc(t.name||'Nouveau dresseur')}</h2>${o('name','Nom',t.name)}
<label>Titre${sl('title',TT.map(x=>`<option ${t.title==x?'selected':''}>${x}</option>`).join(''))}</label>
<label>Spécialité${sl('spec','<option value="">Aucune</option>'+Object.entries(TY).map(([a,v])=>`<option value="${a}" ${t.spec==a?'selected':''}>${v[0]}</option>`).join(''))}</label>
${ch?o('num',"Numéro d'arène",t.num):''}
<label>Portrait (PNG, WEBP, JPG)<input type="file" accept="image/*" onchange="up('${k}',this.files[0])"></label>${rg('z','Taille',.5,3,.05)}${rg('ox','Position horizontale',-100,100,1)}${rg('oy','Position verticale',-100,100,1)}
<label>Biographie<textarea oninput="S.tr.${k}.bio=this.value;save()">${esc(t.bio)}</textarea></label>${o('rw','Récompense (CT / objet)',t.rw)}
<label>Modèle de carte${sl('tpl',['Classique','Prestige','Sombre'].map((n,i)=>`<option value="${i}" ${t.tpl==i?'selected':''}>${n}</option>`).join(''))}</label>
<label>Couleur<input type="color" value="${cl(t)}" oninput="S.tr.${k}.cc=this.value;save();pv('${k}')"></label><button class="s" onclick="S.tr.${k}.cc='';save();edit('${k}')">Couleur du type</button>
${ch?o('badge.name','Nom du badge',t.badge.name)+`<label>Image du badge<input type="file" accept="image/*" onchange="badgeUp('${k}',this.files[0],1)"></label>`:''}
<h3>Équipes</h3>${t.T.map((x,i)=>`<button class="${i==t.a?'':'s'}" onclick="S.tr.${k}.a=${i};save();edit('${k}')">${esc(x.n)}</button>`).join('')}${o(`T[${t.a}].n`,"Nom de l'équipe",t.T[t.a].n)}
${T.map((r,i)=>{const n=info(r);return`<div class="row"><img src="${n.s}"><span style="cursor:pointer" onclick="ps('${k}',${i})">${esc(n.n)}${r.sh?' ✨':''}${isM(r)?' [M]':''} ⚙</span><button class="s" onclick="mv('${k}',${i},-1)">↑</button><button class="s" onclick="mv('${k}',${i},1)">↓</button><button class="${r.sig?'':'s'}" onclick="sig('${k}',${i})">★</button><button class="s" onclick="tm(S.tr.${k}).splice(${i},1);save();edit('${k}')">✕</button></div>`}).join('')}
<button onclick="add('${k}')">+ Ajouter un Pokémon (${T.length}/6)</button></div><div style="width:260px;flex:none"><canvas id="pc"></canvas></div></div>
<p><button onclick="X()">Terminer</button><button class="s" onclick="dup('${k}')">Dupliquer</button>${k[0]=='x'?`<button class="s" onclick="del('${k}')">Supprimer</button>`:`<button class="s" onclick="if(confirm('Réinitialiser ?')){S.tr.${k}=mk('${k}');save();X()}">Réinitialiser</button>`}</p>`);pv(k)}
function ps(k,i){const r=tm(S.tr[k])[i],o=info(r),fm=r.k=='p'?P.filter(p=>p.id>10000&&p.n.startsWith(r.n+' ')):[],a=`'${k}',${i}`,f=(p,l,t='text')=>`<label>${l}<input type="${t}" value="${esc(r[p]||'')}" oninput="R(${a},'${p}',this.value)"></label>`;
M(`<h2>${esc(o.n)}</h2><img src="${o.s}" width="120" style="image-rendering:pixelated">
<label><input type="checkbox" ${r.sh?'checked':''} onchange="R(${a},'sh',this.checked);ps(${a})"> Chromatique (Shiny)</label>

const dp=()=>{const n=SG.f.length;if(!n||!$('#pf')||SG.sf.length!=n)return;const i=SG.cur%n,g=(id,c,fl)=>{const cv=$('#'+id),x=cx2(cv);x.clearRect(0,0,cv.width,cv.height);if(fl){x.translate(cv.width,0);x.scale(-1,1)}x.drawImage(c,0,0)};g('pf',SG.f[i]);g('pd',SG.f[i],1);g('ps',SG.sf[i]);g('pds',SG.sf[i],1);const q=SG.ic,ic=(id,s)=>{const cv=$('#'+id),x=cx2(cv);x.clearRect(0,0,64,64);x.drawImage(s,(i%q)*64,0,64,64,0,0,64,64)};ic('pi',SG.i0);ic('pis',SG.i1)};
function play(){clearTimeout(window._pt);const t=()=>{if(!$('#pf'))return;if(SG.f.length){SG.cur=(SG.cur+1)%SG.f.length;dp()}window._pt=setTimeout(t,(SG.d[SG.cur]||100)/SG.sp)};t()}

function tuto(){M(`<h2>Comment utiliser le générateur ?</h2><ol style="line-height:1.6">
<li><b>Importer :</b> choisis ton PNG (n'importe quelle taille, tourné vers la droite). Le nom apparaît en MAJUSCULES : modifie-le si besoin (ex. POISSON).</li>
<li><b>Nombre de frames :</b> une image 96×96 = 1 frame. Une bande 480×96 = 5 frames. Le nombre est deviné quand la largeur est un multiple de la hauteur ; corrige-le puis clique « Découper ».</li>
<li><b>Normal et Shiny :</b> les 6 aperçus se mettent à jour tout seuls. Pour le Shiny, bouge la teinte automatique ou change chaque couleur dans la palette (colonne de droite = couleur Shiny).</li>
<li><b>Créer une animation :</b> choisis le mouvement du corps, le nombre de frames, puis « Générer ». Pour animer une patte, une queue, une aile : « + Ajouter une partie », place la zone (outil « Zone » puis glisse sur l'image, ou tape x/y/largeur/hauteur), choisis le mouvement et le pivot (le point de la zone collé au corps).</li>
<li><b>Modifier les frames :</b> clique une frame dans la timeline, retouche-la au crayon ou à la gomme. Boutons : ajouter, dupliquer, supprimer, déplacer, annuler/rétablir.</li>
<li><b>Prévisualiser :</b> les aperçus tournent en boucle ; le curseur règle la vitesse, « Durée » règle la frame choisie.</li>
<li><b>Télécharger :</b> bouton « Télécharger les sprites (ZIP) » : rien n'est téléchargé avant ton clic.</li>
<li><b>Dans Essentials :</b> le ZIP contient face, dos, face_shiny, dos_shiny, icon, icon_shiny. Copie chaque fichier dans le dossier correspondant de ton projet (v19+ : Graphics/Pokemon/Front, Back, Front shiny, Back shiny, Icons… ; v18 : Graphics/Battlers et Graphics/Icons). Vérifie les noms exacts dans TON projet : le nom du fichier doit correspondre au nom interne de l'espèce.</li></ol>
<pre style="background:#0006;padding:8px;border-radius:6px">POISSON/\n ├ face/POISSON.png\n ├ dos/POISSON.png\n ├ face_shiny/POISSON.png\n ├ dos_shiny/POISSON.png\n ├ icon/POISSON.png\n └ icon_shiny/POISSON.png</pre>
<p><b>Limites :</b> sans IA, une image fixe ne peut pas être animée parfaitement : les parties (patte, queue…) sont à placer à la main et peuvent laisser des défauts à retoucher au crayon. Les captures d'écran ne sont pas incluses.</p><button onclick="X()">Fermer</button>`)}

<h3>1. Importer</h3><div class="row" style="flex-wrap:wrap"><input placeholder="Nom (ex. POISSON)" value="${esc(SG.name)}" oninput="SG.name=this.value"><input type="file" accept="image/png" onchange="sload(this.files)"></div>

<div class="row" style="flex-wrap:wrap"><label>Vitesse ×<input type="range" min=".25" max="3" step=".25" value="${SG.sp}" oninput="SG.sp=+this.value"></label><label>Icône <select onchange="SG.ic=+this.value;ui()">${op([[2,'2 frames (128×64)'],[1,'1 frame (64×64)']],SG.ic)}</select></label></div>
<h3>3. Shiny</h3><div class="row" style="flex-wrap:wrap"><label>Teinte auto <input type="range" min="0" max="359" value="${SG.hue}" onchange="SG.hue=+this.value;SG.pal={};ui()"></label><button class="s" onclick="SG.pal={};ui()">Réinitialiser les couleurs</button></div><div id="pal" class="row" style="flex-wrap:wrap"></div>
<h3>4. Animation</h3><div class="row" style="flex-wrap:wrap"><label>Corps <select onchange="SG.body=this.value">${op([['resp','Respiration (Normal)'],['crouch','Accroupissement'],['sway','Balancement'],['bounce','Rebond'],['walk','Marche (Normal, Combat)'],['jump','Saut (Insecte, Normal)'],['swim','Nage (Eau)'],['fly','Vol (Vol)'],['glide','Plané (Vol, Dragon)'],['float','Flottement (Spectre, Psy)'],['fight','Attaque / coup (Combat)'],['roar','Rugissement (Dragon)'],['shake','Secousse (Électrik)'],['shiver','Frisson (Glace)'],['crawl','Reptation (Poison, serpents)'],['pulse','Pulsation (Psy, Fée)'],['stomp','Piétinement (Sol, Roche)'],['breeze','Brise (Plante)'],['flicker','Vacillement (Feu)'],['none','Aucun (parties seules)']],SG.body)}</select></label><label>Amplitude <input type="range" min=".5" max="3" step=".5" value="${SG.amp}" oninput="SG.amp=+this.value"></label><label>Frames <select id="nfs">${op([[4,4],[6,6],[8,8],[12,12],[16,16],['x','Personnalisé']],8)}</select></label><input type="number" id="nfc" value="10" min="1" max="64" style="width:64px"></div>
<div id="parts"></div><button class="s" onclick="addPart()">+ Ajouter une partie</button> <button onclick="mkAnim()">▶ Générer l'animation</button>
<h3>5. Timeline et retouche</h3><div id="tl" class="row" style="flex-wrap:wrap"></div>
<div class="row" style="flex-wrap:wrap"><button class="s" onclick="tl2.add()">+ Vide</button><button class="s" onclick="tl2.dup()">Dupliquer</button><button class="s" onclick="tl2.del()">Supprimer</button><button class="s" onclick="tl2.mv(-1)">←</button><button class="s" onclick="tl2.mv(1)">→</button><button class="s" onclick="hgo(-1)">↶ Annuler</button><button class="s" onclick="hgo(1)">↷ Rétablir</button><label>Durée (ms) <input type="number" id="dur" min="20" style="width:80px" onchange="SG.d[SG.sel]=+this.value||100;pushH()"></label></div>
<div class="row" style="flex-wrap:wrap"><select onchange="SG.tool=this.value">${op([['pen','Crayon'],['er','Gomme'],['zone','Zone (partie)']],SG.tool)}</select><input type="color" value="${SG.col}" oninput="SG.col=this.value" style="padding:0;width:44px;height:30px"></div><div id="ew" style="position:relative;display:inline-block;max-width:100%;overflow:auto"></div>
<p><button onclick="exp()">⬇ Télécharger les sprites (ZIP)</button></p>`;ui();play()}
